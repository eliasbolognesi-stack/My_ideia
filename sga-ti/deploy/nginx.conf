# Proxy reverso com nginx — alternativa ao Caddy, para quem já usa nginx.
#
# Diferente do Caddy, aqui o certificado é por sua conta (certbot):
#   sudo certbot --nginx -d sga-ti.suaempresa.com
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sga-ti
#   sudo ln -s /etc/nginx/sites-available/sga-ti /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Quem chegar por http vai para https — sem isso, a primeira visita trafega
# aberta e a senha vai junto.
server {
    listen 80;
    listen [::]:80;
    server_name sga-ti.suaempresa.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sga-ti.suaempresa.com;

    ssl_certificate     /etc/letsencrypt/live/sga-ti.suaempresa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sga-ti.suaempresa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Só o que depende do TLS. A aplicação já manda política de conteúdo,
    # anti-enquadramento, nosniff e política de referência em toda resposta.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # O corpo da requisição é limitado a 1 MB pela própria aplicação; aqui o
    # limite é o mesmo, para recusar antes de ocupar o processo do Node.
    client_max_body_size 1m;

    access_log /var/log/nginx/sga-ti.access.log;
    error_log  /var/log/nginx/sga-ti.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # O SGA-TI só confia nestes cabeçalhos quando SGA_TI_ATRAS_PROXY=1.
        # Ligue essa variável SOMENTE com o proxy na frente, senão o cliente
        # forja o próprio endereço e escapa do limite de tentativas.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
    }

    # A rota de saúde não precisa aparecer no registro de acesso: seriam
    # milhares de linhas por dia do monitor de uptime.
    location = /api/saude {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
